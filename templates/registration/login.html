{% load static %}
<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | LabCore</title><link rel="stylesheet" href="{% static 'labcore.css' %}"><link rel="stylesheet" href="{% static 'pages.css' %}"></head><body><main class="auth-page"><div class="auth-card"><img class="auth-hero" src="{% static 'assets/Captura de tela 2026-08-31 083215.png' %}" alt="Pesquisador LabCore"><h1>Entrar no LabCore</h1><p>Entre para salvar seu progresso e participar do ranking.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label for="user">Usuário</label><input id="user" name="username" autocomplete="username" required autofocus><label for="pass">Senha</label><input id="pass" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar</button></form><p>Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a></p><a class="auth-back" href="{% url 'game' %}">← Continuar como visitante</a></div></main></body></html>
