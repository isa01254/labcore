<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LabCore</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0a0a12;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}header{background:#0d1117;border-bottom:2px solid #1f6feb;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;color:#58a6ff;font-size:1.4rem}.btn{padding:.4rem .8rem;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#fff;text-decoration:none;font-weight:600}#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:1rem;flex-direction:column;gap:1rem}#gameWrap{position:relative;width:640px;height:360px;background:#0a1629;border:2px solid #30363d;border-radius:12px;overflow:hidden}#player{position:absolute;width:20px;height:28px;background:#e8c99a;border:2px solid #000;border-radius:4px;z-index:10}#player::after{content:"";position:absolute;top:-6px;left:2px;width:16px;height:8px;background:#5a3a1a;border-radius:4px}.wall{position:absolute;background:#1b2a4a;border:1px solid #2a3a5a}.obj{position:absolute;width:48px;height:48px;background:#1e3a5f;border:2px solid #58a6ff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px}.obj.done{border-color:#2ea043;background:#14301f;opacity:.6}.prompt{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid #58a6ff;padding:.4rem .8rem;border-radius:6px;font-size:.8rem;display:none}.modal{position:absolute;inset:0;background:rgba(5,10,20,.92);display:none;align-items:center;justify-content:center;z-index:20}.modalBox{background:#161b22;border:2px solid #1f6feb;border-radius:12px;padding:1.2rem;width:420px;text-align:center}.optBtn{width:100%;padding:.6rem;margin:.4rem 0;background:#21262d;border:1px solid #30363d;border-radius:6px;color:#fff;cursor:pointer}.hud{position:absolute;top:6px;left:6px;display:flex;gap:1rem;font-size:.8rem;background:rgba(0,0,0,.6);padding:.3rem .6rem;border-radius:6px}.screen{position:absolute;inset:0;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;z-index:30}.mapBtn{width:300px;padding:.8rem;background:#21262d;border:2px solid #30363d;border-radius:8px;color:#fff;cursor:pointer;font-weight:700}.mapBtn:disabled{opacity:.4}.mapBtn.done{border-color:#2ea043}.keys{font-size:.75rem;color:#8b949e}.keys span{background:#21262d;border:1px solid #30363d;padding:.1rem .4rem;border-radius:4px;color:#58a6ff}</style></head><body>
<header><div class="logo">LABCORE</div><div style="display:flex;gap:.5rem;align-items:center">{% if user.is_authenticated %}<span>{{user.username}} - <b id="hudScore">0</b> pts</span><a class="btn" href="/profile/">Perfil</a><a class="btn" href="/logout/">Sair</a>{% else %}<a class="btn" href="/login/">Entrar</a><a class="btn" href="/register/">Cadastrar</a>{% endif %}</div></header>
<div id="stage"><div id="gameWrap"><div class="hud"><span id="hudPhase">FASE 1</span><span id="hudTimer">00:00</span><span id="hudProgress">0/4</span></div><div id="player"></div><div class="prompt" id="prompt">PRESSIONE E PARA INTERAGIR</div><div class="modal" id="challengeModal"><div class="modalBox"><div id="qTitle" style="color:#58a6ff;font-weight:700;margin-bottom:.5rem"></div><div id="qText"></div><div id="opts"></div><div id="qResult" style="margin-top:.5rem;font-weight:700"></div></div></div><div class="modal" id="resultModal"><div class="modalBox"><h2 id="resTitle">FASE CONCLUÍDA!</h2><div id="resStars" style="font-size:1.8rem;color:#d29922"></div><div id="resScores"></div><button class="optBtn" style="background:#238636" onclick="goMap()">MAPA</button><button class="optBtn" id="nextBtn" onclick="nextPhase()">PRÓXIMA FASE</button></div></div></div><div id="mapScreen" class="screen"><h1 style="color:#58a6ff">MAPA DO LABORATÓRIO</h1><div id="mapBtns" style="display:flex;flex-direction:column;gap:.6rem"></div><div class="keys"><span>WASD</span> mover <span>E</span> interagir <span>ESC</span> mapa</div></div><div class="keys"><span>W A S D</span> mover <span>E</span> interagir</div></div>
<script>
const CHALLENGES={1:[{id:'microscope',icon:'🔬',x:120,y:80,q:'Qual equipamento observa células?',opts:['MICROSCÓPIO','TERMÔMETRO','BALANÇA','BÉQUER'],a:0},{id:'computer',icon:'💻',x:260,y:80,q:'Qual processa dados?',opts:['MICROSCÓPIO','COMPUTADOR','CENTRÍFUGA','PIPETA'],a:1},{id:'centrifuge',icon:'🧪',x:400,y:80,q:'Qual separa por densidade?',opts:['MICROSCÓPIO','TERMÔMETRO','CENTRÍFUGA','BÉQUER'],a:2},{id:'balance',icon:'⚖️',x:520,y:80,q:'Qual mede massa?',opts:['MICROSCÓPIO','TERMÔMETRO','BALANÇA','BÉQUER'],a:2}],2:[{id:'h2o',icon:'💧',x:120,y:80,q:'Elementos para H2O?',opts:['H+H+O','H+O+O','C+H+O','Na+Cl'],a:0},{id:'nacl',icon:'🧂',x:280,y:80,q:'Elementos do NaCl?',opts:['Na+Cl','H+Cl','Na+O','C+Cl'],a:0},{id:'co2',icon:'🌫️',x:440,y:80,q:'Composição CO2?',opts:['C+O','C+O+O','C+H+O','C+C+O'],a:1}],3:[{id:'ohm',icon:'⚡',x:120,y:80,q:'V=10V I=2A => R?',opts:['2 Ω','5 Ω','10 Ω','20 Ω'],a:1},{id:'serie',icon:'🔋',x:300,y:80,q:'3x5Ω em série?',opts:['5 Ω','10 Ω','15 Ω','20 Ω'],a:2},{id:'paralelo',icon:'🔌',x:480,y:80,q:'2x10Ω em paralelo?',opts:['20 Ω','10 Ω','5 Ω','2.5 Ω'],a:2}],4:[{id:'nucleo',icon:'🧬',x:120,y:80,q:'Controla a célula?',opts:['NÚCLEO','MITOCÔNDRIA','CLOROPLASTO','MEMBRANA'],a:0},{id:'mito',icon:'🔴',x:300,y:80,q:'Produz ATP?',opts:['NÚCLEO','MITOCÔNDRIA','CLOROPLASTO','RIBOSSOMO'],a:1},{id:'cloro',icon:'🌿',x:480,y:80,q:'Fotossíntese?',opts:['NÚCLEO','MITOCÔNDRIA','CLOROPLASTO','VACÚOLO'],a:2}],5:[{id:'f1',icon:'🔬',x:140,y:80,q:'FINAL 1/4 - Observa células?',opts:['MICROSCÓPIO','TERMÔMETRO','BALANÇA','BÉQUER'],a:0},{id:'f2',icon:'💧',x:320,y:80,q:'FINAL 2/4 - H2O?',opts:['H+H+O','H+O+O','C+H+O','Na+Cl'],a:0},{id:'f3',icon:'⚡',x:140,y:180,q:'FINAL 3/4 - V=12V I=3A R?',opts:['3 Ω','4 Ω','6 Ω','9 Ω'],a:1},{id:'f4',icon:'🌿',x:320,y:180,q:'FINAL 4/4 - Fotossíntese?',opts:['NÚCLEO','MITOCÔNDRIA','CLOROPLASTO','RIBOSSOMO'],a:2}]};
const NAMES={1:'EQUIPAMENTOS',2:'QUÍMICA',3:'FÍSICA',4:'BIOLOGIA',5:'DESAFIO FINAL'};
let state={phase:1,score:0,unlocked:[1],stars:{},correct:0,mistakes:0}, player={x:100,y:280,w:20,h:28}, keys={}, near=null, t0=0, timer=null, phaseDone=[];
const wrap=document.getElementById('gameWrap'), pEl=document.getElementById('player'), prompt=document.getElementById('prompt');
const modal=document.getElementById('challengeModal'), qTitle=document.getElementById('qTitle'), qText=document.getElementById('qText'), opts=document.getElementById('opts'), qResult=document.getElementById('qResult');
const resModal=document.getElementById('resultModal');
function loadState(){ {% if user.is_authenticated %}fetch('/api/load/').then(r=>r.json()).then(d=>{state.score=d.total_score||0;state.unlocked=d.unlocked_phases||[1];state.phase=d.current_phase||1;state.stars=d.phase_stars||{};state.correct=d.correct_answers||0;state.mistakes=d.mistakes||0;updateHUD();renderMap();});{% else %}let s=JSON.parse(localStorage.getItem('labcore')||'null');if(s)state=s;updateHUD();renderMap();{% endif %} }
function saveState(c=false){localStorage.setItem('labcore',JSON.stringify(state));{% if user.is_authenticated %}fetch('/api/save/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':getCookie('csrftoken')},body:JSON.stringify({total_score:state.score,current_phase:state.phase,unlocked_phases:state.unlocked,phase_stars:state.stars,correct_answers:state.correct,mistakes:state.mistakes,game_completed:c})});{% endif %}}
function getCookie(n){let v=null;document.cookie.split(';').forEach(c=>{c=c.trim();if(c.startsWith(n+'='))v=decodeURIComponent(c.substring(n.length+1))});return v}
function renderMap(){document.getElementById('mapScreen').style.display='flex';const c=document.getElementById('mapBtns');c.innerHTML='';for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='mapBtn';const u=state.unlocked.includes(i),d=state.stars[i];b.textContent=`${i} - ${NAMES[i]}${d?' ★'.repeat(d):u?' ▶':' 🔒'}`;if(d)b.classList.add('done');b.disabled=!u;b.onclick=()=>startPhase(i);c.appendChild(b)}wrap.querySelectorAll('.wall,.obj').forEach(e=>e.remove());}
function goMap(){resModal.style.display='none';modal.style.display='none';clearInterval(timer);renderMap();}
function startPhase(id){state.phase=id;document.getElementById('mapScreen').style.display='none';t0=Date.now();phaseDone=[];clearInterval(timer);timer=setInterval(()=>{let s=Math.floor((Date.now()-t0)/1000);document.getElementById('hudTimer').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},500);document.getElementById('hudPhase').textContent=`FASE ${id} - ${NAMES[id]}`;player.x=100;player.y=280;buildLab(id);updateHUD();}
function buildLab(id){wrap.querySelectorAll('.wall,.obj').forEach(e=>e.remove());[[0,0,640,16],[0,344,640,16],[0,0,16,360],[624,0,16,360],[150,60,16,100],[300,60,16,100],[450,60,16,100]].forEach(([x,y,w,h])=>{let d=document.createElement('div');d.className='wall';d.style.left=x+'px';d.style.top=y+'px';d.style.width=w+'px';d.style.height=h+'px';wrap.appendChild(d)});CHALLENGES[id].forEach(ch=>{let d=document.createElement('div');d.className='obj';d.style.left=ch.x+'px';d.style.top=ch.y+'px';d.textContent=ch.icon;d.dataset.id=ch.id;if(phaseDone.includes(ch.id))d.classList.add('done');wrap.appendChild(d);});}
function walls(){return [...document.querySelectorAll('.wall')].map(e=>({x:parseInt(e.style.left),y:parseInt(e.style.top),w:parseInt(e.style.width),h:parseInt(e.style.height)}))}
function rectColl(ax,ay,aw,ah,b){return ax<b.x+b.w && ax+aw>b.x && ay<b.y+b.h && ay+ah>b.y}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')goMap();if(e.key.toLowerCase()==='e'&&near)openChallenge(near)});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function openChallenge(id){const ch=CHALLENGES[state.phase].find(c=>c.id===id);if(!ch||phaseDone.includes(id))return;modal.style.display='flex';qTitle.textContent=`FASE ${state.phase} - DESAFIO`;qText.textContent=ch.q;qResult.textContent='';opts.innerHTML='';ch.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='optBtn';b.textContent=String.fromCharCode(65+i)+') '+o;b.onclick=()=>{const ok=i===ch.a;if(ok){state.score+=100;state.correct++;qResult.textContent='CORRETO! +100';qResult.style.color='#2ea043';phaseDone.push(id);document.querySelector(`[data-id="${id}"]`)?.classList.add('done');}else{state.mistakes++;qResult.textContent='INCORRETO!';qResult.style.color='#f85149';}updateHUD();saveState();setTimeout(()=>{modal.style.display='none';if(phaseDone.length>=CHALLENGES[state.phase].length)finishPhase();},900);};opts.appendChild(b);});}
function finishPhase(){clearInterval(timer);let secs=Math.floor((Date.now()-t0)/1000),bonus=secs<60?30:secs<120?15:0;state.score+=bonus;let stars=1;if(phaseDone.length===CHALLENGES[state.phase].length)stars++;if(secs<90)stars++;stars=Math.min(3,stars);state.stars[state.phase]=Math.max(state.stars[state.phase]||0,stars);if(state.phase<5&&!state.unlocked.includes(state.phase+1))state.unlocked.push(state.phase+1);saveState(state.phase===5);document.getElementById('resTitle').textContent=state.phase===5?'LABORATÓRIO RESTAURADO!':'FASE CONCLUÍDA!';document.getElementById('resStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);document.getElementById('resScores').innerHTML=`Pontos: ${state.score}<br>Bônus tempo: ${bonus}`;document.getElementById('nextBtn').textContent=state.phase===5?'JOGAR NOVAMENTE':'PRÓXIMA FASE';resModal.style.display='flex';updateHUD();}
function nextPhase(){resModal.style.display='none';if(state.phase===5){state={phase:1,score:0,unlocked:[1],stars:{},correct:0,mistakes:0};saveState()}else if(state.phase<5){startPhase(state.phase+1);return}goMap();}
function updateHUD(){document.getElementById('hudScore').textContent=state.score;document.getElementById('hudProgress').textContent=phaseDone.length+'/'+(CHALLENGES[state.phase]?.length||0);}
function loop(){if(document.getElementById('mapScreen').style.display!=='none'||modal.style.display==='flex'||resModal.style.display==='flex'){requestAnimationFrame(loop);return}let nx=player.x,ny=player.y,s=2.2;if(keys['w']||keys['arrowup'])ny-=s;if(keys['s']||keys['arrowdown'])ny+=s;if(keys['a']||keys['arrowleft'])nx-=s;if(keys['d']||keys['arrowright'])nx+=s;let blocked=false;for(let w of walls())if(rectColl(nx,ny,player.w,player.h,w))blocked=true;if(!blocked){player.x=Math.max(16,Math.min(620,nx));player.y=Math.max(16,Math.min(330,ny));}pEl.style.left=player.x+'px';pEl.style.top=player.y+'px';near=null;let best=Infinity;document.querySelectorAll('.obj').forEach(o=>{if(o.classList.contains('done'))return;let ox=parseInt(o.style.left)+24,oy=parseInt(o.style.top)+24;let d=Math.hypot(player.x+10-ox,player.y+14-oy);if(d<48&&d<best){best=d;near=o.dataset.id}});prompt.style.display=near?'block':'none';requestAnimationFrame(loop);}
loadState();loop();
</script></body></html>
